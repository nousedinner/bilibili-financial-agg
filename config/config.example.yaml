# B站财经博主聚合服务配置

# 敏感信息从 .env 读取：SESSDATA, XIAOMI_API_KEY, DB_USER, DB_PASSWORD（API 用户通过管理命令创建）

bloggers:
  - mid: 2137589551
    name: "李大霄"
    tags: ["价值投资", "A股"]
    enabled: true

scheduler:
  fetch_cron_1: "0 12 * * *"
  fetch_cron_2: "0 21 * * *"
  digest_cron: "10 22 * * *"
  digest_cutoff_hour: 22
  timezone: "Asia/Shanghai"

asr:
  api_url: "https://api.xiaomimimo.com/v1/chat/completions"
  model: "mimo-v2.5-asr"
  chunk_seconds: 180
  # Wait is honored only after a real server test push was clicked on the phone.
  auth_failure_policy: "continue"
  daily_audio_minutes: 180
  batch_audio_minutes: 60

llm:
  provider: "xiaomi"
  model: "mimo-v2.6-flash"
  api_url: "https://api.xiaomimimo.com/v1/chat/completions"

database:
  host: "mysql"
  port: 3306
  name: "fin_agg"
  charset: "utf8mb4"

server:
  host: "0.0.0.0"
  port: 8091

data:
  backfill_since: "2026-07-01"
  backfill_cap: 20
  first_run_cap: 20
  automatic_window_days: 7
  credential_path: "/app/data/bili-credential.json"

push:
  service_account_file: "/app/data/firebase-service-account.json"

limits:
  comment_fetch_count: 20
  danmaku_sample_size: 2000
  video_interval_seconds: 5
  backoff_base_seconds: 10
  request_interval_seconds: 1
  http_cooldown_seconds: 120
  risk_cooldown_seconds: 900
  daily_llm_calls: 300
