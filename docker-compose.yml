services:
  fin-agg:
    build: .
    container_name: fin-agg
    ports:
      - "127.0.0.1:8091:8091"
    networks:
      - mysql-net
    volumes:
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=mysql
      - DB_PORT=3306
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/health')"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  mysql-net:
    external: true
